name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The original components (evidence.py) use enum.StrEnum,
        # which requires Python 3.11+; CI exercises the supported
        # versions accordingly.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Byte-compile sources
        run: python -m compileall -q src tests

      # Stdlib-only runner (unittest): the project policy forbids
      # external dependencies, including development extras.
      - name: Run test suite (stdlib unittest)
        run: |
          set -o pipefail
          python -m unittest discover -s tests/unit -p 'test_*.py' -v 2>&1 | tee /tmp/unittest.log | tail -5
          code=$?
          exit $code

      - name: Diagnose failures (temporary)
        if: failure()
        run: |
          {
            echo "FAIL/ERROR lines:"
            grep -E "^(FAIL|ERROR):" /tmp/unittest.log | head -60
            echo "summary:"
            grep -E "^(Ran |OK|FAILED)" /tmp/unittest.log | tail -3
            echo "first traceback:"
            awk '/^={20,}$/{f=1} f{print; n++} n>50{exit}' /tmp/unittest.log
          } > diag.txt
          # URL-encode and chunk the diagnosis into annotations
          ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote(open('diag.txt').read()[:14000]))")
          TOTAL=$(( ( ${#ENC} + 899 ) / 900 ))
          echo "::error title=diag-meta::len=${#ENC} chunks=$TOTAL"
          i=0
          offset=0
          while [ $offset -lt ${#ENC} ]; do
            i=$((i+1))
            part=$(python3 -c "print('$ENC'[$offset:$offset+900])")
            echo "::error title=diag-$i-of-$TOTAL::$part"
            offset=$((offset+900))
          done
