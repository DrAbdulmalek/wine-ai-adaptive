name: CI

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The original components (evidence.py) use enum.StrEnum,
        # which requires Python 3.11+; CI exercises the supported
        # versions accordingly.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Byte-compile sources
        run: python -m compileall -q src tests

      # Stdlib-only runner (unittest): the project policy forbids
      # external dependencies, including development extras.
      - name: Run test suite (stdlib unittest)
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Verify bundled recipe data in wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {len(wheels)}")
          required = {
              "wine_ai/recipes/trados-studio.json",
              "wine_ai/recipes/memoq.json",
          }
          with zipfile.ZipFile(wheels[0]) as wheel:
              packaged = set(wheel.namelist())
          missing = sorted(required - packaged)
          if missing:
              raise SystemExit(f"Recipe data missing from wheel: {missing}")
          print("Both bundled recipe files are present in the wheel.")
          PY
