name: CI

on:
  push:
    branches: [main, "security/**", "fix/**"]
  pull_request:
    branches: [main, "security/**", "fix/**"]
  workflow_dispatch:

jobs:
  # Secret scanning (unified plan §4.2): any commit introducing key
  # material must fail CI. Runs once, not per Python version.
  # Acceptance check (owner-side, on a scratch branch): a commit
  # containing a realistic high-entropy AWS-shaped access key must fail
  # this job; delete the scratch branch afterwards. Verified locally
  # with gitleaks v8.28.0: the canonical AWS-documentation example key
  # is allowlisted by the default config and does NOT trip the scanner,
  # so the dummy commit must use a realistic high-entropy key. Never
  # embed key-shaped material, even examples, in committed files.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the pushed history

      - name: Secret scan (gitleaks)
        # Pinned to the commit the v2 tag dereferences (verified via
        # git ls-remote 2026-11-13); a floating tag would allow silent
        # action swaps.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Documentation contract checks (unified plan §5.1/§5.2): the CAT
  # compatibility matrix must never claim evidence without an existing
  # sanitized log, and STATUS.md stays the single source of truth.
  # Runs once, not per Python version; the unit tests for both scripts
  # (tests/unit/test_cat_matrix.py, test_release_docs.py) run in the
  # tests job.
  docs-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CAT compatibility matrix check
        run: python scripts/check_cat_matrix.py

      - name: STATUS.md single-source check
        run: python scripts/check_status_refs.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The original components (evidence.py) use enum.StrEnum,
        # which requires Python 3.11+; CI exercises the supported
        # versions accordingly.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Byte-compile sources
        run: python -m compileall -q src tests

      # Stdlib-only runner (unittest): the project policy forbids
      # external dependencies, including development extras.
      - name: Run test suite (stdlib unittest)
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Verify bundled recipe data in wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {len(wheels)}")
          required = {
              "wine_ai/recipes/trados-studio.json",
              "wine_ai/recipes/memoq.json",
          }
          with zipfile.ZipFile(wheels[0]) as wheel:
              packaged = set(wheel.namelist())
          missing = sorted(required - packaged)
          if missing:
              raise SystemExit(f"Recipe data missing from wheel: {missing}")
          print("Both bundled recipe files are present in the wheel.")
          PY
