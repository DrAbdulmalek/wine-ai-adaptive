name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The original components (evidence.py) use enum.StrEnum,
        # which requires Python 3.11+; CI exercises the supported
        # versions accordingly.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Byte-compile sources
        run: python -m compileall -q src tests

      # Stdlib-only runner (unittest): the project policy forbids
      # external dependencies, including development extras.
      - name: Run test suite (stdlib unittest)
        run: |
          set -o pipefail
          python -m unittest discover -s tests/unit -p 'test_*.py' -v 2>&1 | tee /tmp/unittest.log | tail -5
          code=$?
          exit $code

      - name: Diagnose failures (temporary)
        if: failure()
        run: |
          {
            echo "unittest failure diagnosis (py ${{ matrix.python-version }}) run ${{ github.run_id }}"
            echo '```text'
            grep -E "^(FAIL|ERROR):|^Ran |^OK|^FAILED" /tmp/unittest.log | head -60
            echo '--- tail ---'
            tail -n 260 /tmp/unittest.log
            echo '```'
          } > diag.txt
          B64=$(base64 -w0 diag.txt)
          jq -n --arg b "$B64" '{message:"ci diagnosis (temporary)", content:$b, branch:"${{ github.event.pull_request.head.ref }}"}' > payload.json
          for i in 1 2 3 4 5; do
            code=$(curl -s -o putresp.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/contents/ci-diagnosis/py${{ matrix.python-version }}.txt \
              -d @payload.json)
            echo "PUT attempt $i -> $code"
            [ "$code" = "200" ] && break
            sleep 8
          done
