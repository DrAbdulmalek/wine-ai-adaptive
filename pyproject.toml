[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-ai-adaptive"
version = "1.0.0"
description = "Local-first hardened diagnostic knowledge core for Wine on Linux"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DrAbdulmalek" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["wine", "diagnostics", "sqlite", "knowledge-store", "hardened", "local-first", "evidence", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
wine-ai = "wine_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wine_ai = ["gpu_compatibility/data/*.json", "recipes/*.json"]
